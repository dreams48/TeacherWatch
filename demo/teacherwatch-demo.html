<title>TeacherWatch — démonstration</title>
<style>
:root{
  --encre:#123c3a; --encre-2:#2f4f4d; --ocre:#a8690f; --brique:#97302a; --vert:#1c6642;
  --papier:#f6f5f1; --craie:#ffffff; --trait:#d8dbd4; --texte:#18211f; --doux:#5f6b68;
  --surligne:#eef0ea; --ombre:0 1px 2px rgba(18,60,58,.07),0 1px 8px rgba(18,60,58,.05);
  --serif:Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --encre:#7fd0c4; --encre-2:#9fdcd2; --ocre:#e0a33f; --brique:#e8776c; --vert:#5cc38c;
  --papier:#111716; --craie:#1b2321; --trait:#2d3936; --texte:#e7ece9; --doux:#93a29e;
  --surligne:#232d2b; --ombre:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --encre:#7fd0c4; --encre-2:#9fdcd2; --ocre:#e0a33f; --brique:#e8776c; --vert:#5cc38c;
  --papier:#111716; --craie:#1b2321; --trait:#2d3936; --texte:#e7ece9; --doux:#93a29e;
  --surligne:#232d2b; --ombre:0 1px 2px rgba(0,0,0,.4);
}
:root[data-theme="light"]{
  --encre:#123c3a; --encre-2:#2f4f4d; --ocre:#a8690f; --brique:#97302a; --vert:#1c6642;
  --papier:#f6f5f1; --craie:#ffffff; --trait:#d8dbd4; --texte:#18211f; --doux:#5f6b68;
  --surligne:#eef0ea; --ombre:0 1px 2px rgba(18,60,58,.07),0 1px 8px rgba(18,60,58,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);color:var(--texte);font:16px/1.5 var(--sans);
  -webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:1.5rem;letter-spacing:-.01em}
h2{font-size:1.15rem;margin-top:0}
.mono,td.num,.mat{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.9em}

/* ---- barre d'identité ---- */
.chapeau{background:var(--encre);color:var(--papier);padding:.5rem 1rem}
:root[data-theme="dark"] .chapeau,
:root:not([data-theme="light"]) .chapeau{color:var(--papier)}
@media (prefers-color-scheme:dark){.chapeau{background:#0d1413;color:var(--texte);border-bottom:1px solid var(--trait)}}
:root[data-theme="dark"] .chapeau{background:#0d1413;color:var(--texte);border-bottom:1px solid var(--trait)}
:root[data-theme="light"] .chapeau{background:#123c3a;color:#f6f5f1;border-bottom:0}
.chapeau-in{max-width:1120px;margin:0 auto;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.ident{font-family:var(--serif);font-size:1.05rem;line-height:1.2}
.ident small{display:block;font-family:var(--sans);font-size:.68rem;opacity:.75;letter-spacing:.06em;
  text-transform:uppercase;margin-top:.15rem}
.role-box{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.role-box select{font:inherit;padding:.3rem .5rem;border-radius:5px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.12);color:inherit;min-width:0;max-width:100%;
  text-overflow:ellipsis}
@media (prefers-color-scheme:dark){.role-box select{background:var(--craie);border-color:var(--trait)}}
:root[data-theme="dark"] .role-box select{background:var(--craie);border-color:var(--trait)}
:root[data-theme="light"] .role-box select{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}

/* ---- bandeau démo ---- */
.demo-bar{background:var(--ocre);color:#fff;font-size:.8rem;padding:.4rem 1rem;text-align:center}
@media (prefers-color-scheme:dark){.demo-bar{background:#3a2b0d;color:var(--ocre)}}
:root[data-theme="dark"] .demo-bar{background:#3a2b0d;color:var(--ocre)}
:root[data-theme="light"] .demo-bar{background:#a8690f;color:#fff}

/* ---- onglets ---- */
nav.onglets{background:var(--craie);border-bottom:1px solid var(--trait);overflow-x:auto}
nav.onglets ul{max-width:1120px;margin:0 auto;padding:0 .5rem;list-style:none;display:flex;gap:.1rem}
nav.onglets button{font:inherit;font-size:.9rem;background:none;border:0;border-bottom:2.5px solid transparent;
  color:var(--doux);padding:.7rem .8rem;cursor:pointer;white-space:nowrap}
nav.onglets button:hover{color:var(--texte);background:var(--surligne)}
nav.onglets button[aria-current="page"]{color:var(--encre);border-bottom-color:var(--encre);font-weight:600}
nav.onglets button:focus-visible{outline:2px solid var(--encre);outline-offset:-2px}

main{max-width:1120px;margin:0 auto;padding:1.25rem 1rem 4rem;display:flex;flex-direction:column;gap:1.25rem}
.entete-vue{display:flex;gap:.75rem;align-items:baseline;flex-wrap:wrap}
.entete-vue p{margin:0;color:var(--doux);font-size:.88rem}

.carte{background:var(--craie);border:1px solid var(--trait);border-radius:9px;padding:1rem;
  box-shadow:var(--ombre);display:flex;flex-direction:column;gap:.75rem}
.carte>h2+p{margin-top:-.4rem}
.legende{color:var(--doux);font-size:.83rem;margin:0}

/* ---- tuiles secteurs ---- */
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:.7rem}
.tuile{border:1px solid var(--trait);border-radius:8px;background:var(--craie);padding:.7rem .8rem;
  display:flex;flex-direction:column;gap:.4rem;border-left:4px solid var(--trait)}
.tuile.s-ok{border-left-color:var(--vert)} .tuile.s-attente{border-left-color:var(--ocre)}
.tuile.s-non{border-left-color:var(--brique)} .tuile.s-hors{border-left-color:var(--trait)}
.tuile .tnom{font-weight:600;font-size:.94rem;line-height:1.25}
.tuile .tinfo{color:var(--doux);font-size:.78rem}
.pastille{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;font-weight:600;
  padding:.16rem .5rem;border-radius:999px;border:1px solid;width:fit-content}
.p-ok{color:var(--vert);border-color:var(--vert);background:color-mix(in srgb,var(--vert) 10%,transparent)}
.p-attente{color:var(--ocre);border-color:var(--ocre);background:color-mix(in srgb,var(--ocre) 10%,transparent)}
.p-non{color:var(--brique);border-color:var(--brique);background:color-mix(in srgb,var(--brique) 10%,transparent)}
.p-hors{color:var(--doux);border-color:var(--trait);background:var(--surligne)}
.p-info{color:var(--encre);border-color:var(--encre);background:color-mix(in srgb,var(--encre) 9%,transparent)}

/* ---- bandeaux d'état ---- */
.avis{border-radius:8px;padding:.7rem .9rem;font-size:.9rem;border:1px solid;display:flex;gap:.6rem;
  align-items:flex-start;flex-wrap:wrap}
.avis strong{font-weight:600}
.a-rappel{color:var(--ocre);border-color:var(--ocre);background:color-mix(in srgb,var(--ocre) 8%,transparent)}
.a-verrou{color:var(--doux);border-color:var(--trait);background:var(--surligne)}
.a-info{color:var(--encre-2);border-color:var(--encre);background:color-mix(in srgb,var(--encre) 7%,transparent)}
.a-refus{color:var(--brique);border-color:var(--brique);background:color-mix(in srgb,var(--brique) 8%,transparent)}

/* ---- formulaires / boutons ---- */
label{font-size:.82rem;font-weight:600;display:block;margin-bottom:.2rem}
select,input[type="date"],input[type="text"],input[type="search"]{font:inherit;font-size:.92rem;
  padding:.42rem .55rem;border:1px solid var(--trait);border-radius:6px;background:var(--craie);
  color:var(--texte);max-width:100%}
.rangee{display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end}
button.act{font:inherit;font-size:.9rem;font-weight:600;background:var(--encre);color:var(--papier);
  border:0;border-radius:6px;padding:.5rem .9rem;cursor:pointer}
@media (prefers-color-scheme:dark){button.act{color:#0d1413}}
:root[data-theme="dark"] button.act{color:#0d1413}
:root[data-theme="light"] button.act{color:#f6f5f1}
button.act:hover{background:var(--encre-2)}
button.act[disabled]{opacity:.45;cursor:not-allowed}
button.sec{background:var(--craie);color:var(--texte);border:1px solid var(--trait);font-weight:500}
button.sec:hover{background:var(--surligne)}
button.mini{font-size:.78rem;padding:.25rem .55rem}
button.danger{background:none;color:var(--brique);border:1px solid var(--brique)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--encre);outline-offset:1px}

/* ---- tableaux ---- */
.defile{overflow-x:auto;border:1px solid var(--trait);border-radius:8px;background:var(--craie)}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--trait);vertical-align:top}
th{background:var(--surligne);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;
  color:var(--doux);font-weight:700;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr:hover{background:var(--surligne)}
.vide{padding:1rem;color:var(--doux);font-size:.88rem;text-align:center}

/* ---- liste de cours (saisie) ---- */
.creneaux{display:flex;flex-direction:column;gap:.5rem}
.tranche-bloc{border:1px solid var(--trait);border-radius:8px;overflow:hidden}
.tranche-tete{background:var(--surligne);padding:.4rem .7rem;font-size:.8rem;font-weight:700;
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.tranche-tete .duree{font-weight:500;color:var(--doux);font-family:var(--mono);font-size:.78rem}
.cours{display:flex;gap:.6rem;align-items:center;padding:.5rem .7rem;border-top:1px solid var(--trait);
  flex-wrap:wrap}
.cours:first-of-type{border-top:0}
.cours .cl{font-weight:600;font-size:.88rem;min-width:7.5rem}
.cours .en{flex:1 1 12rem;font-size:.86rem}
.cours .en small{display:block;color:var(--doux);font-size:.76rem}
.cours .actions{display:flex;gap:.3rem;margin-left:auto}
.cours.inactif{opacity:.55}
.jum{font-size:.72rem;color:var(--encre);border:1px solid var(--encre);border-radius:4px;
  padding:0 .3rem;font-weight:600}

.total{display:flex;gap:1.5rem;flex-wrap:wrap;padding:.6rem .8rem;background:var(--surligne);
  border-radius:8px;font-size:.86rem}
.total b{font-family:var(--mono);font-size:1.05rem;display:block}
.total span{color:var(--doux);font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}

dialog{border:1px solid var(--trait);border-radius:10px;background:var(--craie);color:var(--texte);
  max-width:min(30rem,92vw);padding:1.1rem;box-shadow:0 8px 40px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(10,20,18,.5)}
dialog form{display:flex;flex-direction:column;gap:.7rem}
.dlg-pied{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
  .carte,.tuile{transition:background .15s ease}
}
@media (max-width:620px){
  main{padding:1rem .7rem 3rem}
  .cours .cl{min-width:100%}
  .role-box{margin-left:0;width:100%}
  .role-box select{flex:1 1 0}
  .chapeau-in{gap:.5rem}
}
</style>

<script>
"use strict";
const S = JSON.parse(document.getElementById('seed').textContent);
// Libellés et conventions reprises du prototype du lycée.
const JUSTIF = {a_statuer:'En attente', justifiee:'Justifié', non_justifiee:'Non justifié'};
const TYPES = {absence:'Absence', retard:'Retard', depart:'Départ anticipé'};
// Retards et départs anticipés sont qualifiés par tranche de durée, pas en minutes libres.
const DUREES = {lt15:'moins de 15 min', '15to30':'15 à 30 min', gt30:'plus de 30 min'};

/* ---------- état de la démonstration ---------- */
const CLE = 'tw-demo-v2';
let E = charger();
function charger(){
  try { const b = JSON.parse(localStorage.getItem(CLE)); if (b && b.v === 2) return b; } catch(e){}
  return {v:2, evts:[], soums:[], jours:{}, audit:[], gen:{}, role:'prov', jour:defautJour(), vue:'suivi'};
}
function garder(){ try{ localStorage.setItem(CLE, JSON.stringify(E)); }catch(e){} }
function defautJour(){ const d = new Date().getDay(); return (d>=1 && d<=5) ? d-1 : 0; }

/* ---------- rôles (issus du fichier du personnel) ---------- */
const prov = S.encadrement.find(p=>p.fonction==='PROVISEUR');
const cens = S.encadrement.find(p=>p.fonction==='CENSEUR');
const ROLES = [
  {id:'prov', nom: prov ? prov.nom : 'Proviseur', lib:'Proviseur', type:'direction', sect:null},
  {id:'admin', nom: cens ? cens.nom : 'Censeur', lib:'Censeur (administrateur)', type:'direction', sect:null},
  ...S.secteurs.map((s,i)=>({id:'surv'+i, nom:s, lib:'Surveillant de secteur', type:'surv', sect:i})),
];
const role = () => ROLES.find(r=>r.id===E.role) || ROLES[0];
const direction = () => role().type==='direction';
const monSect = () => role().sect;

/* ---------- accès aux données ---------- */
const clsSect = i => S.classes[i].s;
const nomCls  = i => S.classes[i].n;

// cours d'un jour : [jour, tranche, classe, ens, mat]
function coursJour(j){ return S.cours.filter(c=>c[0]===j); }
// clé de jumelage : même jour + tranche + enseignant sur plusieurs classes
function grouperJumelage(liste){
  const par = new Map();
  liste.forEach(c=>{ if(c[3]<0) return; const k=c[0]+'|'+c[1]+'|'+c[3]; (par.get(k)||par.set(k,[]).get(k)).push(c); });
  const jum = new Map();
  for (const [k,v] of par){ if (new Set(v.map(c=>c[2])).size>1) jum.set(k,v.map(c=>c[2])); }
  return jum;
}
const JUM_JOUR = {};
function jumDuJour(j){ if(!JUM_JOUR[j]) JUM_JOUR[j]=grouperJumelage(coursJour(j)); return JUM_JOUR[j]; }
const cleJum = c => c[0]+'|'+c[1]+'|'+c[3];

// situation administrative déclarée (CONGE MATERNITE, STAGE, HORS DU PAYS…)
const situation = ei => S.situations[ei] || null;

// secteurs ayant des cours ce jour (avec un enseignant identifié)
function secteursConcernes(j){
  const s = new Set();
  coursJour(j).forEach(c=>{ if(c[3]>=0){ const k=clsSect(c[2]); if(k>=0) s.add(k); } });
  return s;
}
function etatSecteur(j, si){
  const conc = secteursConcernes(j).has(si);
  const soums = E.soums.filter(x=>x.j===j && x.s===si);
  const verrou = !!(E.jours[j] && E.jours[j].verrou);
  if (!conc) return {code:'hors', lib:'Non concerné', detail:'aucun cours programmé', n:0};
  if (!soums.length) return verrou
    ? {code:'non', lib:'Non soumis', detail:'journée verrouillée', n:0}
    : {code:'attente', lib:'En attente', detail:'aucune soumission', n:0};
  const avec = soums.some(x=>x.n>0);
  return {code:'ok', lib: avec ? 'Soumis — avec événements' : 'Soumis — aucune absence',
          detail: soums.length+' soumission'+(soums.length>1?'s':''), n:soums.length};
}

/* ---------- audit ---------- */
function tracer(action, objet, avant, apres, motif){
  E.audit.unshift({t:new Date().toISOString(), qui:role().nom, r:role().lib, action, objet,
                   avant:avant||null, apres:apres||null, motif:motif||null});
  if (E.audit.length>400) E.audit.length=400;
}

/* ---------- règles de comptage (conventions du lycée) ---------- */
// Une absence vaut UNE heure, quelle que soit la durée réelle de la tranche.
// Les absences justifiées restent à l'historique mais sont exclues des totaux.
// Les retards et départs anticipés ne comptent aucune heure : ils sont suivis
// par tranche de durée.
function heures(ev){
  if (ev.type !== 'absence') return 0;
  if (ev.just === 'justifiee') return 0;
  return 1;
}
// Classes touchées : le groupement jumelé compte chaque classe individuellement,
// alors que l'enseignant ne se voit imputer qu'une seule heure.
function classesTouchees(evts){
  const s = new Set();
  evts.filter(e=>e.type==='absence' && e.just!=='justifiee')
      .forEach(e=>String(e.cls_n).split(' / ').forEach(c=>s.add(c)));
  return s.size;
}

/* ---------- rendu : utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h2 = n => (Math.round(n*100)/100).toString().replace('.',',');

function dialogue(titre, corpsHtml, boutons){
  const f = $('#dlg-form');
  f.innerHTML = '<h2>'+esc(titre)+'</h2>'+corpsHtml+'<div class="dlg-pied">'+boutons+'</div>';
  $('#dlg').showModal();
}

/* ---------- vue : suivi du jour ---------- */
function vueSuivi(){
  const j = E.jour, verrou = !!(E.jours[j]&&E.jours[j].verrou), cl = E.jours[j]&&E.jours[j].classement;
  const conc = secteursConcernes(j);
  const etats = S.secteurs.map((_,i)=>etatSecteur(j,i));
  const transmis = etats.filter(e=>e.code==='ok').length;
  let html = '<div class="entete-vue"><h1>Suivi du '+esc(S.jours[j])+'</h1>'
    + '<p>'+transmis+' secteur(s) transmis sur '+conc.size+' concerné(s)</p></div>';

  const moi = monSect();
  if (moi!=null && etats[moi].code==='attente')
    html += '<div class="avis a-rappel"><strong>Rappel de 16 h.</strong> Votre secteur n’a pas encore transmis '
      + 'son rapport. La journée est verrouillée à 18 h. '
      + '<button class="act mini" data-go="saisie">Aller à la saisie</button></div>';

  if (verrou)
    html += '<div class="avis a-verrou"><strong>Journée verrouillée.</strong> '
      + (cl==='sans_cours' ? 'Classement automatique : <strong>journée sans cours</strong> — aucun secteur n’avait transmis. ' : '')
      + (direction() ? '<button class="sec mini" data-act="deverrouiller">Déverrouiller (motif requis)</button>'
         + (cl==='sans_cours' ? ' <button class="sec mini" data-act="classer">Corriger le classement</button>' : '')
        : 'Seule la direction peut encore intervenir.')+'</div>';

  html += '<section class="carte"><h2>État des cinq secteurs</h2><div class="tuiles">'
    + S.secteurs.map((s,i)=>{
        const e = etats[i], mine = i===moi;
        return '<div class="tuile s-'+e.code+'">'
          + '<div class="tnom">'+esc(s)+(mine?' <span class="jum">mon secteur</span>':'')+'</div>'
          + '<div class="tinfo">'+esc(S.niveaux?S.niveaux[i]:'')+'</div>'
          + '<span class="pastille p-'+(e.code==='hors'?'hors':e.code==='ok'?'ok':e.code==='attente'?'attente':'non')+'">'+esc(e.lib)+'</span>'
          + '<div class="tinfo">'+esc(e.detail)+'</div></div>';
      }).join('')
    + '</div><p class="legende">Un secteur sans cours programmé est « non concerné » : il n’est ni relancé, '
    + 'ni compté comme défaillant.</p></section>';

  if (!verrou && direction())

      + '</tbody></table></div>';

  return html;
}

/* ---------- rapport ---------- */
function construireRapport(jours){
  const evts = E.evts.filter(x=>x.soum && jours.includes(x.j));
  // fusion des classes jumelées : une seule ligne, une seule heure
  const vus = new Map(); const lignes = [];
  evts.forEach(ev=>{
    if (ev.jum){
      const k = ev.j+'|'+ev.t+'|'+ev.ei+'|'+ev.type;
      const d = vus.get(k);
      if (d){ String(ev.cls_n).split(' / ').forEach(c=>{ if(!d.classes.includes(c)) d.classes.push(c); }); return; }
      const l = {...ev, classes:String(ev.cls_n).split(' / ')}; vus.set(k,l); lignes.push(l);
    } else lignes.push({...ev, classes:String(ev.cls_n).split(' / ')});
  });
  lignes.sort((a,b)=>a.j-b.j || a.t-b.t || a.en_n.localeCompare(b.en_n));
  const detail = lignes.map((l,i)=>({...l, n:i+1, classe:l.classes.join(' / '), h:heures(l)}));
  const parEns = new Map();
  detail.forEach(l=>{ const k=l.en_m||l.en_n;
    const c = parEns.get(k)||{nom:l.en_n, mat:l.en_m||'—', disc:l.en_d||'—', h:0};
    c.h += l.h; parEns.set(k,c); });
  const recap = [...parEns.values()].filter(r=>r.h>=1).sort((a,b)=>b.h-a.h).map((r,i)=>({...r,n:i+1}));
  const conc = new Set(); jours.forEach(j=>secteursConcernes(j).forEach(s=>conc.add(s)));
  const trans = new Set(E.soums.filter(x=>jours.includes(x.j)).map(x=>x.s));
  return {detail, recap, jours, conc:conc.size, trans:trans.size,
          clsTouchees:classesTouchees(evts),
          total:detail.reduce((s,l)=>s+l.h,0),
          definitif: jours.every(j=>E.jours[j]&&E.jours[j].verrou)};
}

  + 'la durée de la tranche, les absences justifiées sont exclues des totaux, et les retards et départs '
  + 'anticipés sont qualifiés par tranche de durée sans compter d’heure.</li>'
  + '<li>La <strong>fusion des classes jumelées</strong> : une absence sur un cours jumelé compte une heure, pas deux.</li>'
  + '<li>Le <strong>cloisonnement par secteur</strong> : changez de rôle pour un surveillant, l’emploi du temps '
  + 'et la saisie se restreignent à son secteur.</li>'
  + '<li>Les <strong>créneaux non pédagogiques</strong> (Bibliothèque, Pause, Orientation — 885 lignes dans vos '
  + 'fichiers) ne sont pas saisissables : ils n’attendent aucun enseignant.</li>'
  + '<li>Les <strong>situations administratives</strong> réellement présentes dans votre fichier (congé de '
  + 'maternité, stage, hors du pays) excluent l’enseignant de la saisie.</li>'
  + '<li>Le <strong>verrouillage</strong>, le classement « journée sans cours », les corrections motivées '
  + 'et le <strong>journal d’audit</strong>.</li></ul></section>'
  + '<section class="carte"><h2>Ce que seule l’application installée fait</h2>'
  + '<ul style="margin:0;padding-left:1.2rem;font-size:.92rem;line-height:1.7">'
  + '<li>La <strong>vraie connexion</strong> : ici le sélecteur de rôle remplace l’authentification. '
  + 'Le cloisonnement affiché est réel mais il est appliqué par cette page ; dans l’application il est '
  + 'vérifié par le serveur, ce qu’un navigateur ne peut pas démontrer.</li>'
  + '<li>La <strong>base commune</strong> : vos saisies restent dans ce navigateur et ne sont vues par personne '
  + 'd’autre. Plusieurs surveillants sur une même journée exigent l’application installée.</li>'
  + '<li>Les <strong>traitements de 16 h et 18 h</strong> qui partent seuls, les e-mails, les sauvegardes '
  + 'et l’import de nouveaux fichiers Excel.</li></ul>'
  + '<div class="rangee"><button class="danger act" data-act="reset">Réinitialiser la démonstration</button>'
  + '<p class="legende" style="flex:1 1 12rem">Efface les saisies d’essai et repart des fichiers d’origine.</p></div>'
  + '</section>';
}

/* ---------- routage ---------- */
const VUES = [
  {id:'suivi', lib:'Suivi du jour', f:vueSuivi},
  {id:'saisie', lib:'Saisie', f:vueSaisie},
  {id:'edt', lib:'Emploi du temps', f:vueEdt},
  {id:'rapports', lib:'Rapports', f:vueRapports, direction:true},
  {id:'personnel', lib:'Personnel', f:vuePersonnel, direction:true},
  {id:'audit', lib:'Journal d’audit', f:vueAudit, direction:true},
  {id:'apropos', lib:'À propos', f:vueApropos},
];

function dessiner(){
  // rôles
  const sr = $('#sel-role');
  if (!sr.options.length)
    sr.innerHTML = ROLES.map(r=>'<option value="'+r.id+'">'+esc(r.lib)+' — '+esc(r.nom.length>34?r.nom.slice(0,32)+'…':r.nom)+'</option>').join('');
  sr.value = E.role;
  // onglets accessibles
  const dispo = VUES.filter(v=>!v.direction || direction());
  if (!dispo.some(v=>v.id===E.vue)) E.vue='suivi';
  $('#onglets').innerHTML = dispo.map(v=>'<li><button data-vue="'+v.id+'"'
    + (v.id===E.vue?' aria-current="page"':'')+'>'+esc(v.lib)+'</button></li>').join('');
  const jourSel = '<div class="carte" style="padding:.6rem .8rem"><div class="rangee">'
    + '<div><label for="sel-jour">Journée</label><select id="sel-jour">'
    + S.jours.map((d,i)=>'<option value="'+i+'"'+(i===E.jour?' selected':'')+'>'+esc(d)+'</option>').join('')
    + '</select></div><p class="legende" style="flex:1 1 16rem;align-self:center">La démonstration porte sur '
    + 'une semaine type de votre emploi du temps. Choisissez le jour à travailler.</p></div></div>';
  const v = dispo.find(x=>x.id===E.vue);
  $('#vue').innerHTML = (['suivi','saisie'].includes(v.id) ? jourSel : '') + v.f();
  garder();
}

/* ---------- actions ---------- */
// Un retard ou un départ anticipé est qualifié par sa tranche de durée avant
// enregistrement ; une absence n'a pas de durée à saisir.
function ajouter(cls, t, ei, type){
  if (type !== 'absence' && !ajouter.duree){
    dialogue(TYPES[type]+' — durée constatée',
      '<div><label for="d-duree">Tranche de durée</label><select id="d-duree" style="width:100%">'
      + Object.entries(DUREES).map(([k,v])=>'<option value="'+k+'">'+esc(v)+'</option>').join('')
      + '</select></div>',
      '<button class="sec" value="non">Annuler</button><button class="act" id="ok-d">Enregistrer</button>');
    document.getElementById('ok-d').onclick = e => {
      e.preventDefault();
      ajouter.duree = document.getElementById('d-duree').value;
      $('#dlg').close();
      ajouter(cls, t, ei, type);
      ajouter.duree = null;
    };
    return;
  }
  ajouterVraiment(cls, t, ei, type, type==='absence' ? null : ajouter.duree);
}

function ajouterVraiment(cls, t, ei, type, duree){
  const c = coursJour(E.jour).find(x=>x[2]===cls && x[1]===t && x[3]===ei);
  if (!c) return;
  const en = S.ens[ei], jum = jumDuJour(E.jour), estJum = jum.has(cleJum(c));
  const si = clsSect(cls);
  // contrôle de secteur, côté « serveur » de la démonstration
  if (!direction() && si!==monSect()){
    dialogue('Accès refusé', '<div class="avis a-refus">Vous ne pouvez pas saisir pour un autre secteur '
      + 'que le vôtre.</div>', '<button class="act">Fermer</button>');
    return;
  }
  // Un enseignant ne peut avoir qu'un seul événement sur une tranche donnée,
  // quelle que soit la classe du groupement où la saisie a été faite.
  const doublon = E.evts.find(x=>x.j===E.jour && x.t===t && x.ei===ei);
  if (doublon){
    const autreSect = doublon.s!==si;
    dialogue('Doublon empêché', '<div class="avis a-refus">'+esc(en.n)+' a déjà un événement enregistré '
      + 'sur la tranche T'+(t+1)+' ('+esc(TYPES[doublon.type])+'). '
      + (estJum ? 'Ce cours est <strong>jumelé</strong> : une seule déclaration couvre '
        + esc(jum.get(cleJum(c)).map(nomCls).join(' / '))+'.' : '')
      + (autreSect ? '<br><br>La déclaration a été faite par le secteur <strong>'
        + esc(S.secteurs[doublon.s])+'</strong>. Ce cours étant à cheval sur plusieurs secteurs, '
        + 'l’absence ne doit être comptée qu’une fois.' : '')+'</div>',
      '<button class="act">Fermer</button>');
    return;
  }
  // Sur un cours jumelé, l'événement porte le groupement complet et compte une
  // seule heure : c'est la règle qui empêche le double comptage (audit B-02).
  const groupe = estJum ? jum.get(cleJum(c)) : [cls];
  const libClasse = groupe.map(nomCls).join(' / ');
  const id = 'e'+Date.now()+Math.random().toString(36).slice(2,6);
  E.evts.push({id, j:E.jour, t, cls, ei, s:si, type, duree:duree||null, just:'a_statuer', soum:null,
    cls_n:libClasse, nbCls:groupe.length, en_n:en.n, en_m:en.m, en_d:en.d,
    mat_n:c[4]>=0?S.mat[c[4]]:null, jum:estJum, cree:new Date().toISOString()});
  tracer('creation_evenement', en.n+' · '+libClasse+' · T'+(t+1), null, TYPES[type], null);
  dessiner();
}

function soumettre(){
  const j = E.jour, si = direction() ? (E.sectSaisie!=null?E.sectSaisie:0) : monSect();
  const br = E.evts.filter(x=>x.j===j && x.s===si && !x.soum);
  const finir = () => {
    const num = E.soums.filter(x=>x.j===j && x.s===si).length + 1;
    const sid = 's'+Date.now();
    br.forEach(x=>x.soum = sid);
    E.soums.push({id:sid, j, s:si, num, n:br.length, qui:role().nom, t:new Date().toISOString()});
    tracer('soumission', S.secteurs[si]+' · '+S.jours[j]+' · n° '+num, null,
      br.length ? br.length+' événement(s)' : 'aucune absence signalée', null);
    $('#dlg').close(); dessiner();
    dialogue('Soumission enregistrée', '<div class="avis a-info">Soumission n° '+num+' pour « '
      + esc(S.secteurs[si])+' ».<br>'+(br.length?br.length+' événement(s) désormais verrouillé(s) : vous ne pouvez '
      + 'plus les modifier.':'Rapport « aucune absence signalée » transmis.')
      + '<br>Le proviseur en est notifié.</div>', '<button class="act">Fermer</button>');
  };
  if (!br.length)
    dialogue('Aucun brouillon', '<p style="margin:0;font-size:.92rem">Vous allez transmettre un rapport '
      + '<strong>« aucune absence signalée »</strong> pour « '+esc(S.secteurs[si])+' ». '
      + 'C’est un acte positif : il atteste que le secteur a été vérifié.</p>',
      '<button class="sec" value="non">Annuler</button><button class="act" id="ok-vide">Je confirme</button>');
  else finir();
  const ok = document.getElementById('ok-vide');
  if (ok) ok.onclick = ev => { ev.preventDefault(); finir(); };
}

function corriger(id){
  const ev = E.evts.find(x=>x.id===id); if (!ev) return;
  dialogue('Correction administrative',
    '<p style="margin:0;font-size:.9rem">'+esc(ev.en_n)+' — '+esc(ev.cls_n)+', T'+(ev.t+1)+'</p>'
    + '<div><label for="c-just">Justification</label><select id="c-just" style="width:100%">'
    + Object.entries(JUSTIF).map(([k,v])=>'<option value="'+k+'"'+(ev.just===k?' selected':'')+'>'+esc(v)+'</option>').join('')
    + '</select></div>'
    + '<div><label for="c-type">Nature</label><select id="c-type" style="width:100%">'
    + Object.entries(TYPES).map(([k,v])=>'<option value="'+k+'"'+(ev.type===k?' selected':'')+'>'+esc(v)+'</option>').join('')
    + '</select></div>'
    + '<div><label for="c-motif">Motif de la correction (obligatoire)</label>'
    + '<input id="c-motif" type="text" style="width:100%" placeholder="ex. justificatif présenté au censorat"></div>',
    '<button class="sec" value="non">Annuler</button><button class="act" id="ok-corr">Enregistrer</button>');
  document.getElementById('ok-corr').onclick = e => {
    e.preventDefault();
    const motif = document.getElementById('c-motif').value.trim();
    if (!motif){ document.getElementById('c-motif').focus(); return; }
    const av = TYPES[ev.type]+' / '+JUSTIF[ev.just];
    ev.just = document.getElementById('c-just').value;
    ev.type = document.getElementById('c-type').value;
    tracer('correction_evenement', ev.en_n+' · '+ev.cls_n, av, TYPES[ev.type]+' / '+JUSTIF[ev.just], motif);
    $('#dlg').close(); dessiner();
  };
}

function verrouiller(){
  const j = E.jour;
  const conc = secteursConcernes(j);
  const trans = new Set(E.soums.filter(x=>x.j===j).map(x=>x.s));
  const classement = (conc.size>0 && trans.size===0) ? 'sans_cours' : 'avec_cours';
  E.jours[j] = {verrou:true, classement};
  tracer('verrouillage_18h', S.jours[j], null,
    classement==='sans_cours' ? 'journée sans cours (automatique)' : trans.size+' secteur(s) transmis sur '+conc.size, null);
  dessiner();
  dialogue('Journée verrouillée', '<div class="avis '+(classement==='sans_cours'?'a-rappel':'a-info')+'">'
    + (classement==='sans_cours'
      ? 'Aucun secteur n’avait transmis : la journée est classée <strong>« journée sans cours »</strong> '
        + 'et le proviseur est notifié. Il peut corriger ce classement.'
      : trans.size+' secteur(s) sur '+conc.size+' ont transmis. Les secteurs restants sont marqués '
        + '<strong>« non soumis »</strong>.')+'</div>', '<button class="act">Fermer</button>');
}

function motifPuis(titre, action){
  dialogue(titre, '<div><label for="m-motif">Motif (obligatoire, conservé au journal d’audit)</label>'
    + '<input id="m-motif" type="text" style="width:100%"></div>',
    '<button class="sec" value="non">Annuler</button><button class="act" id="ok-m">Valider</button>');
  document.getElementById('ok-m').onclick = e => {
    e.preventDefault();
    const m = document.getElementById('m-motif').value.trim();
    if (!m){ document.getElementById('m-motif').focus(); return; }
    action(m); $('#dlg').close(); dessiner();
  };
}

/* ---------- export Word ---------- */
async function exportWord(){
  const type = E.rapType||'journalier';
  const jours = type==='journalier' ? [E.jour] : S.jours.map((_,i)=>i);
  const R = construireRapport(jours);
  E.gen[type] = (E.gen[type]||0)+1;
  const nGen = E.gen[type];
  const per = type==='journalier' ? S.jours[E.jour] : 'semaine (lundi au vendredi)';
  const now = new Date().toLocaleString('fr-FR');
  const tb = (cols, lignes) => '<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%;font-size:10pt">'
    + '<tr>'+cols.map(c=>'<th bgcolor="#EEEEEE" align="left">'+esc(c)+'</th>').join('')+'</tr>'
    + (lignes.length?lignes.map(l=>'<tr>'+l.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')
       :'<tr><td colspan="'+cols.length+'"><i>Aucun élément.</i></td></tr>')+'</table>';
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" '
    + 'xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'
    + '<head><meta charset="utf-8"><title>Rapport '+esc(type)+'</title>'
    + '<style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt}h1{font-size:15pt;text-align:center}'
    + 'p{margin:2pt 0}</style></head><body>'
    + '<p align="center" style="font-size:9pt">RÉPUBLIQUE DU CAMEROUN — Paix • Travail • Patrie</p>'
    + '<p align="center"><b style="font-size:13pt">'+esc(S.etab.toUpperCase())+'</b></p>'
    + '<p align="center" style="font-size:9pt"><i>[Emplacement de l’en-tête officiel et du logo]</i></p>'
    + '<h1>Rapport '+(type==='journalier'?'journalier':'hebdomadaire')+' des absences des enseignants</h1>'
    + '<p><b>Période couverte :</b> '+esc(per)+'</p>'
    + '<p><b>Génération n° '+nGen+'</b> — le '+esc(now)+' (heure du Cameroun)</p>'
    + (nGen>1?'<p><i>Ce document annule et remplace la génération n° '+(nGen-1)+'.</i></p>':'')
    + '<p><b>Rapports reçus :</b> '+R.trans+' secteur(s) sur '+R.conc+' concerné(s)</p>'
    + '<p><b>Heures d’absence comptées :</b> '+h2(R.total)+' — <b>classes touchées :</b> '+R.clsTouchees+'</p>'
    + (!R.definitif?'<p><b>RAPPORT INTERMÉDIAIRE — NON DÉFINITIF :</b> la période n’est pas verrouillée.</p>':'')
    + '<h2 style="font-size:12pt">1. Rapport détaillé</h2>'
    + tb(['N°','Jour','Horaire','Nom de l’enseignant','Matricule','Classe','Matière','Type','Durée','Justification','Heures'],
        R.detail.map(l=>[l.n,S.jours[l.j],S.tranches[l.t].lib,l.en_n,l.en_m||'—',l.classe,l.mat_n||'—',
                         TYPES[l.type],l.duree?DUREES[l.duree]:'—',JUSTIF[l.just],h2(l.h)]))
    + '<h2 style="font-size:12pt">2. Récapitulatif par enseignant</h2>'
    + '<p style="font-size:9pt"><i>Seuls les enseignants totalisant au moins une heure d’absence apparaissent.</i></p>'
    + tb(['N°','Nom de l’enseignant','Matricule','Spécialité','Heures d’absence'],
        R.recap.map(r=>[r.n,r.nom,r.mat,r.disc,h2(r.h)]))
    + '<p style="font-size:9pt"><i>Une absence vaut une heure. Les absences justifiées sont conservées '
    + 'à l’historique mais exclues des totaux. Les absences non encore qualifiées sont signalées '
    + '« En attente ».</i></p>'
    + '<br><br><p><b>Le Proviseur</b></p><p>Signature : ______________________________</p>'
    + '</body></html>';
  const nom = 'rapport-'+type+'-g'+nGen+'.doc';
  tracer('export_word', 'rapport '+type+' · génération n° '+nGen, null, R.detail.length+' ligne(s)', null);
  garder();
  if (window.claude && window.claude.downloads) {
    try {
      await window.claude.downloads.save({filename:nom, data:doc});
      dessiner();
      return;
    } catch(err){ /* refus ou indisponible : on retombe sur le téléchargement direct */ }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([doc], {type:'application/msword'}));
  a.download = nom; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  dessiner();
}

/* ---------- écouteurs ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.vue){ E.vue = b.dataset.vue; dessiner(); return; }
  if (b.dataset.go){ E.vue = b.dataset.go; dessiner(); return; }
  if (b.dataset.add){ const [c,t,ei,ty] = b.dataset.add.split(','); ajouter(+c,+t,+ei,ty); return; }
  if (b.dataset.sup){
    const ev = E.evts.find(x=>x.id===b.dataset.sup);
    if (ev && ev.soum && !direction()){
      dialogue('Événement verrouillé', '<div class="avis a-refus">Cet événement a été soumis : il est '
        + '<strong>immuable</strong> pour le surveillant. Adressez-vous au censorat ou au proviseur.</div>',
        '<button class="act">Fermer</button>'); return;
    }
    E.evts = E.evts.filter(x=>x.id!==b.dataset.sup);
    tracer('retrait_brouillon', ev?ev.en_n+' · '+ev.cls_n:'—', null, null, null);
    dessiner(); return;
  }
  if (b.dataset.corr){ corriger(b.dataset.corr); return; }
  const a = b.dataset.act;
  if (a==='soumettre') soumettre();
  else if (a==='verrouiller') verrouiller();
  else if (a==='word') exportWord();
  else if (a==='deverrouiller') motifPuis('Déverrouiller la journée', m=>{
    const av = E.jours[E.jour]; E.jours[E.jour]={verrou:false, classement:av?av.classement:null};
    tracer('deverrouillage_journee', S.jours[E.jour], 'verrouillée', 'ouverte', m); });
  else if (a==='classer') motifPuis('Corriger le classement de la journée', m=>{
    const av = E.jours[E.jour]; const nv = av.classement==='sans_cours'?'avec_cours':'sans_cours';
    E.jours[E.jour]={...av, classement:nv};
    tracer('correction_classement_journee', S.jours[E.jour],
      av.classement==='sans_cours'?'journée sans cours':'journée avec cours',
      nv==='sans_cours'?'journée sans cours':'journée avec cours', m); });
  else if (a==='reset'){
    dialogue('Réinitialiser', '<p style="margin:0;font-size:.92rem">Toutes les saisies d’essai, soumissions '
      + 'et traces d’audit de cette démonstration seront effacées. Les fichiers d’origine du lycée ne '
      + 'sont pas touchés.</p>',
      '<button class="sec" value="non">Annuler</button><button class="act danger" id="ok-r">Effacer</button>');
    document.getElementById('ok-r').onclick = ev => { ev.preventDefault();
      localStorage.removeItem(CLE); E = charger(); $('#dlg').close(); dessiner(); };
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id==='sel-role'){ E.role = t.value; E.sectSaisie=null; dessiner(); }
  else if (t.id==='sel-jour'){ E.jour = +t.value; dessiner(); }
  else if (t.id==='sel-ej'){ E.edtJour = +t.value; dessiner(); }
  else if (t.id==='sel-sect'){ E.sectSaisie = +t.value; dessiner(); }
  else if (t.id==='sel-rap'){ E.rapType = t.value; dessiner(); }
});
let minuteur;
document.addEventListener('input', e => {
  if (e.target.id==='q' || e.target.id==='qp'){
    const k = e.target.id==='q' ? 'q' : 'qp', v = e.target.value;
    clearTimeout(minuteur);
    minuteur = setTimeout(()=>{ E[k]=v; const pos=e.target.selectionStart; dessiner();
      const el=document.getElementById(k); if(el){el.focus(); el.setSelectionRange(pos,pos);} }, 260);
  }
});

document.getElementById('etab').textContent = S.etab;
dessiner();
</script>
